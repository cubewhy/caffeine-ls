name: Build & Package VS Code Extension

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # The nightly release workflow calls this so it ships exactly the artifacts
  # this workflow produces.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  package-extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows are both built on Linux, cross-compiled:
          # `cross` builds the Linux binary inside its glibc container, and
          # `cargo-xwin` builds the MSVC Windows binary against the Microsoft
          # CRT/SDK it downloads (cross-rs has no MSVC image, so it cannot build
          # that target itself).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vsce_target: linux-x64
            bin_name: caffeine-ls
            builder: cross

          - os: ubuntu-latest
            target: x86_64-pc-windows-msvc
            vsce_target: win32-x64
            bin_name: caffeine-ls.exe
            builder: cargo-xwin

          # The Darwin binaries link against the macOS SDK, so they are built on
          # real macOS runners: arm64 on an Apple Silicon image, x64 on an Intel
          # one.
          - os: macos-latest
            target: aarch64-apple-darwin
            vsce_target: darwin-arm64
            bin_name: caffeine-ls
            builder: cargo

          - os: macos-15-intel
            target: x86_64-apple-darwin
            vsce_target: darwin-x64
            bin_name: caffeine-ls
            builder: cargo

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross / cargo-xwin
        if: matrix.builder != 'cargo'
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ matrix.builder }}

      # cargo-xwin links through the LLVM tools shipped with the toolchain
      # (`rust-lld`, `llvm-ar`) and compiles C dependencies with `clang`, which
      # the runner image already provides.
      - name: Install LLVM tools for cargo-xwin
        if: matrix.builder == 'cargo-xwin'
        run: rustup component add llvm-tools-preview

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # cargo-xwin unpacks the Windows CRT and SDK here; without the cache
          # every run would re-download them.
          cache-directories: ${{ matrix.builder == 'cargo-xwin' && '~/.cache/cargo-xwin' || '' }}

      - name: Fetch decompiler jars
        run: cargo xtask prepare

      # `cross` builds inside a container that has neither a JDK nor the
      # runner's system paths, while `project-model`'s build script runs Gradle
      # to build the Maven sidecar jar. The runner's JDK is a symlink farm
      # (`.../Java_Temurin-Hotspot_jdk/<version>/x64` -> `/usr/lib/jvm/...`, and
      # the distribution's `lib/security/cacerts` -> `/etc/ssl/certs/java`), so
      # mounting it as-is leaves the container with a dangling trust store and
      # every Gradle download fails with "the trustAnchors parameter must be
      # non-empty". Copy it dereferenced so the container gets a self-contained
      # JDK.
      - name: Build Rust binary (cross)
        if: matrix.builder == 'cross'
        run: |
          jdk="$RUNNER_TEMP/jdk"
          cp -rL "$JAVA_HOME" "$jdk"
          chmod -R a+rX "$jdk"
          export CROSS_CONTAINER_OPTS="-v $jdk:$jdk:ro -e JAVA_HOME=$jdk -e GRADLE_USER_HOME=/tmp/gradle-home"
          cross build --release --target ${{ matrix.target }}

      - name: Build Rust binary (cargo-xwin)
        if: matrix.builder == 'cargo-xwin'
        run: cargo xwin build --release --target ${{ matrix.target }}

      - name: Build Rust binary (native)
        if: matrix.builder == 'cargo'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy binary to extension bin folder
        shell: bash
        run: |
          mkdir -p editors/code/bin
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} editors/code/bin/
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x editors/code/bin/${{ matrix.bin_name }}
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "editors/code/pnpm-lock.yaml"

      - name: Install extension dependencies
        working-directory: ./editors/code
        run: pnpm install --frozen-lockfile

      - name: Package VSIX
        working-directory: ./editors/code
        run: |
          pnpx @vscode/vsce package --target ${{ matrix.vsce_target }} --no-dependencies -o caffeine-ls-${{ matrix.vsce_target }}.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.vsce_target }}
          path: editors/code/*.vsix
