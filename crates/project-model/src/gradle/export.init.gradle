// Supported Range: Gradle 4.x - 9.x+
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

boolean isDebugEnabled() {
    return System.getProperty('CAFFEINE_LS_GRADLE_DEBUG') == '1' || System.getenv('CAFFEINE_LS_GRADLE_DEBUG') == '1'
}

void debugLog(String message) {
    if (isDebugEnabled()) {
        System.err.println("CAFFEINE_LS_GRADLE_DEBUG: ${message}")
    }
}

String normalizePath(def file) {
    if (file == null) return null
    try {
        return file.absoluteFile.path.replace(File.separatorChar, '/' as char)
    } catch (Throwable ignored) {
        return null
    }
}

// Set by the driver (`-Dcaffeine.ls.downloadSources=true`) when the client
// opted into downloading dependency sources. Read once; the export task
// resolves each dependency's `-sources.jar` classifier when it is on.
def downloadSources = System.getProperty('caffeine.ls.downloadSources') == 'true'

List<Map<String, Object>> extractRichClasspath(def project, String configName, boolean downloadSources) {
    def config = project.configurations.findByName(configName)
    if (config == null || (config.hasProperty('canBeResolved') && !config.canBeResolved)) {
        debugLog("    [WARN] Configuration '${configName}' missing or unresolvable.")
        return []
    }

    def entries = []

    // Strategy 1: Modern ArtifactView (Preferred for Gradle 5.x - 9.x)
    try {
        def artifacts = config.incoming.artifactView { viewConfig -> 
            viewConfig.lenient(true) 
        }.artifacts

        artifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            def filePath = normalizePath(artifact.file)

            if (id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) {
                entries << [
                    type: 'project',
                    path: id.projectPath,
                    source_set: 'main'
                ]
            } else if (filePath && filePath.endsWith('.jar')) {
                def origin = (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) ? 'coordinate' : 'flat-file'
                def entry = [
                    type: 'jar',
                    path: filePath,
                    origin: origin,
                    sources: null
                ]
                if (origin == 'coordinate') {
                    entry.group = id.group
                    entry.artifact = id.module
                    entry.version = id.version
                }
                entries << entry
            }
        }
        if (!entries.isEmpty()) {
            debugLog("    [SUCCESS] Resolved '${configName}' via ArtifactView: ${entries.size()} entries")
            return entries
        }
    } catch (Throwable t) {
        debugLog("    [INFO] ArtifactView fell back for '${configName}': ${t.message}")
    }

    // Strategy 2: Legacy Lenient Configuration (Fallback for Gradle 4.x)
    try {
        def resolvedArtifacts = config.resolvedConfiguration.lenientConfiguration.artifacts
        resolvedArtifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            def filePath = normalizePath(artifact.file)

            if (id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) {
                entries << [
                    type: 'project',
                    path: id.projectPath,
                    source_set: 'main'
                ]
            } else if (filePath && filePath.endsWith('.jar')) {
                def origin = (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) ? 'coordinate' : 'flat-file'
                def entry = [
                    type: 'jar',
                    path: filePath,
                    origin: origin,
                    sources: null
                ]
                if (origin == 'coordinate') {
                    entry.group = id.group
                    entry.artifact = id.module
                    entry.version = id.version
                }
                entries << entry
            }
        }
        debugLog("    [SUCCESS] Resolved '${configName}' via Legacy Lenient Configuration: ${entries.size()} entries")
        return entries
    } catch (Throwable t) {
        debugLog("    [ERROR] Failed to resolve '${configName}' via Legacy method: ${t.message}")
    }
    
    return []
}

def getSourceSets(def project) {
    try { return project.extensions.getByType(org.gradle.api.tasks.SourceSetContainer) } catch (Throwable ignored) {}
    try { return project.extensions.findByName('java')?.sourceSets } catch (Throwable ignored) {}
    try { return project.convention.findPlugin(org.gradle.api.plugins.JavaPluginConvention)?.sourceSets } catch (Throwable ignored) {}
    try { return project.convention.getPlugin(org.gradle.api.plugins.JavaPluginConvention).sourceSets } catch (Throwable ignored) {}
    return null
}

/// The source directories of one source set, in every language it holds.
///
/// The Java plugin's `sourceSets.main.java.srcDirs` is the baseline; a source
/// set the Kotlin Gradle plugin extends exposes the Kotlin directories under
/// its own extension (`sourceSets.main.kotlin.srcDirs`), and KGP versions whose
/// per-source-set extension is not reachable put them on the project-level
/// `kotlin` extension instead. Every probe is guarded, so a project without the
/// Kotlin plugin — or with a KGP whose internals differ — still exports its
/// Java directories, and the conventional `src/<set>/kotlin` directory is added
/// when the probes yield nothing and the directory exists.
def sourceDirsOf(def sourceSet, def project) {
    if (sourceSet == null) return []
    def dirs = []
    try { dirs += sourceSet.java?.srcDirs?.collect { normalizePath(it) } ?: [] } catch (Throwable ignored) {}
    def kotlinDirs = []
    try { kotlinDirs += sourceSet.kotlin?.srcDirs?.collect { normalizePath(it) } ?: [] } catch (Throwable ignored) {}
    try {
        def kotlin = project.extensions.findByName('kotlin')
        def kotlinSet = kotlin?.sourceSets?.findByName(sourceSet.name)
        kotlinDirs += kotlinSet?.kotlin?.srcDirs?.collect { normalizePath(it) } ?: []
    } catch (Throwable ignored) {}
    kotlinDirs = kotlinDirs.findAll { it }
    if (kotlinDirs.isEmpty()) {
        // The standard layout, when the plugin exposes no directory for it.
        def conventional = new File(project.projectDir, "src/${sourceSet.name}/kotlin")
        if (conventional.isDirectory()) {
            kotlinDirs << normalizePath(conventional)
        }
    }
    // Generated roots are reported separately; a source set that lists
    // `build/generated` under either language must not have it here.
    dirs += kotlinDirs
    return dirs.findAll { it }.unique()
}

gradle.projectsEvaluated {
    // Build only the producers declared by local file dependencies. Share the
    // barrier across projects so parallel consumers cannot export too early.
    def fileDependencyBuildDependencies = []
    rootProject.allprojects.each { project ->
        ['compileClasspath', 'testCompileClasspath', 'compile', 'testCompile'].each { configName ->
            def config = project.configurations.findByName(configName)
            if (config != null && (!config.hasProperty('canBeResolved') || config.canBeResolved)) {
                config.allDependencies.withType(org.gradle.api.artifacts.FileCollectionDependency).each { dependency ->
                    fileDependencyBuildDependencies << dependency.files.buildDependencies
                }
            }
        }
    }

    // Each project exports its own model from a task registered in that
    // project, so configuration resolution happens at execution time AND in
    // the declaring project. Gradle 9 forbids both configuration-time
    // resolution and cross-project resolution under parallel execution
    // ("attempted without an exclusive lock"), which previously produced
    // empty classpaths.
    rootProject.allprojects.each { project ->
        project.tasks.register('exportProjectWorkspaceModel') {
            group = 'caffeine-ls'
            dependsOn(fileDependencyBuildDependencies)
            def outputFile = new File(project.buildDir, 'caffeine-ls/workspace-model.json')
            doLast {
                debugLog(">>> Analyzing project: ${project.path}")

                def sourceSets = getSourceSets(project)
                def mainSet = null
                def testSet = null
                try {
                    mainSet = sourceSets?.findByName('main')
                    testSet = sourceSets?.findByName('test')
                } catch (Throwable ignored) {}

                def mainSource = sourceDirsOf(mainSet, project)
                def testSource = sourceDirsOf(testSet, project)

                def resourcesSource = []
                try {
                    def mainRes = mainSet?.resources?.srcDirs?.collect { normalizePath(it) } ?: []
                    def testRes = testSet?.resources?.srcDirs?.collect { normalizePath(it) } ?: []
                    resourcesSource = (mainRes + testRes).unique()
                } catch (Throwable ignored) {}

                def compileCp = extractRichClasspath(project, 'compileClasspath', downloadSources)
                if (compileCp.isEmpty()) {
                    compileCp = extractRichClasspath(project, 'compile', downloadSources)
                }

                def testCp = extractRichClasspath(project, 'testCompileClasspath', downloadSources)
                if (testCp.isEmpty()) {
                    testCp = extractRichClasspath(project, 'testCompile', downloadSources)
                }

                // Resolve each coordinate's `-sources.jar` once per project,
                // over the union of both classpaths, and write the result back
                // into the very maps that are serialized below. Every lookup is
                // guarded, so a component without published sources, a Gradle
                // that rejects the notation or an offline repository leaves
                // `sources` null and the export still succeeds.
                Map<String, String> sourcesByComponent = [:]
                if (downloadSources) {
                    (compileCp + testCp).each { entry ->
                        if (entry.type != 'jar' || entry.origin != 'coordinate') return
                        def key = "${entry.group}:${entry.artifact}:${entry.version}"
                        if (sourcesByComponent.containsKey(key)) return
                        try {
                            // Documented legacy notation `group:name:version:classifier`.
                            def cfg = project.configurations.detachedConfiguration(
                                project.dependencies.create("${key}:sources"))
                            def files = cfg.files
                            sourcesByComponent[key] = files.isEmpty() ? null : normalizePath(files.iterator().next())
                        } catch (Throwable ignored) {
                            debugLog("    [INFO] no sources for ${key}")
                            sourcesByComponent[key] = null
                        }
                    }
                    [compileCp, testCp].each { list ->
                        list.each { entry ->
                            if (entry.type == 'jar' && entry.origin == 'coordinate') {
                                entry.sources = sourcesByComponent["${entry.group}:${entry.artifact}:${entry.version}"]
                            }
                        }
                    }
                }

                def allGenerated = []
                try {
                    sourceSets?.each { ss ->
                        ss.allSource.srcDirs.each { dir ->
                            def path = normalizePath(dir)
                            if (path && (path.contains('/generated/') || path.contains('build/generated'))) {
                                allGenerated << path
                            }
                        }
                    }
                } catch (Throwable ignored) {}

                def javaHome = normalizePath(new File(System.getProperty('java.home')))
                def javaRelease = null
                def javaPreview = false
                // The `java` extension's `sourceCompatibility` is only the
                // *default* a `JavaCompile` task inherits at plugin-apply time.
                // A task-level assignment (`compileJava { sourceCompatibility =
                // '1.8' }`, or `tasks.withType(JavaCompile) { ... }`) overrides
                // the task's own property without touching the extension, so the
                // task is the authoritative source: it is what javac is given.
                def javaLangVersionFromTask = null
                try {
                    def compileJavaTask = project.tasks.findByName('compileJava')
                    if (compileJavaTask != null) {
                        def release = compileJavaTask.options.release
                        if (release != null && release.isPresent()) {
                            // Only forward a value the model can hold: an
                            // out-of-range release must not fail the whole
                            // workspace import, it just disables level gating.
                            def releaseValue = release.get()
                            if (releaseValue instanceof Number && releaseValue >= 0 && releaseValue <= 255) {
                                javaRelease = releaseValue
                            }
                        }

                        // An explicit `-source`/`--release` in `compilerArgs` is
                        // appended after the flag Gradle derives from the task
                        // property, so it is what javac ends up honouring.
                        def compilerArgs = compileJavaTask.options.compilerArgs
                        for (int i = 0; i < compilerArgs.size(); i++) {
                            def arg = compilerArgs[i].toString()
                            def value = null
                            if (arg == '-source' || arg == '--source' || arg == '--release') {
                                if (i + 1 < compilerArgs.size()) {
                                    value = compilerArgs[i + 1].toString()
                                }
                            } else if (arg.startsWith('--release=')) {
                                value = arg.substring('--release='.length())
                            } else if (arg.startsWith('-source=') || arg.startsWith('--source=')) {
                                value = arg.substring(arg.indexOf('=') + 1)
                            }
                            if (value != null) {
                                def digits = value.replaceAll(/[^0-9].*$/, '')
                                if (digits ==~ /\d+/ && digits.toInteger() >= 0 && digits.toInteger() <= 255) {
                                    if (arg.startsWith('--release')) {
                                        javaRelease = digits.toInteger()
                                    } else {
                                        javaLangVersionFromTask = value
                                    }
                                }
                            }
                        }

                        javaPreview = compilerArgs.contains('--enable-preview')

                        // `sourceCompatibility` is an inherited `-source` value.
                        // Guarded: a task type without the property (or a failed
                        // resolution of it) must not lose the release above.
                        try {
                            def taskSourceCompatibility = compileJavaTask.sourceCompatibility
                            if (taskSourceCompatibility != null && javaLangVersionFromTask == null) {
                                javaLangVersionFromTask = taskSourceCompatibility.toString()
                            }
                        } catch (Throwable ignored) {}

                        // The JVM that will actually compile: a configured
                        // toolchain replaces the task's compiler, and its
                        // installation is the platform the sources are checked
                        // against. `respondTo` is *not* usable here — Gradle's
                        // decorated task types reject it (their DynamicObject
                        // answers only for real properties), and the throw
                        // would silently skip this block — so the property is
                        // probed directly.
                        def compilerProvider = null
                        try {
                            if (compileJavaTask.hasProperty('javaCompiler')) {
                                compilerProvider = compileJavaTask.property('javaCompiler')
                            }
                        } catch (Throwable ignored) {}

                        if (compilerProvider != null && compilerProvider.isPresent()) {
                            try {
                                javaHome = normalizePath(compilerProvider.get().getMetadata().getInstallationPath().getAsFile())
                            } catch (Throwable ignored) {}
                        } else if (compileJavaTask.options.fork && compileJavaTask.options.forkOptions.javaHome != null) {
                            javaHome = normalizePath(compileJavaTask.options.forkOptions.javaHome)
                        }
                    }
                } catch (Throwable ignored) {}

                // The extension chain is the fallback for projects without a
                // resolvable `compileJava` task.
                def javaLangVersion = javaLangVersionFromTask
                try {
                    if (javaLangVersion == null) {
                        def javaExt = project.extensions.findByName('java')
                        if (javaExt != null && javaExt.hasProperty('sourceCompatibility')) {
                            javaLangVersion = javaExt.sourceCompatibility.toString()
                        }
                    }
                    if (javaLangVersion == null) {
                        def convention = project.convention.findPlugin(org.gradle.api.plugins.JavaPluginConvention)
                        if (convention != null) {
                            javaLangVersion = convention.sourceCompatibility?.toString()
                        }
                    }
                    if (javaLangVersion == null && project.hasProperty('sourceCompatibility')) {
                        javaLangVersion = project.sourceCompatibility.toString()
                    }
                } catch (Throwable ignored) {}

                def model = [
                    path: project.path,
                    name: project.name,
                    project_dir: normalizePath(project.projectDir),
                    source_roots: mainSource,
                    test_roots: testSource,
                    resource_roots: resourcesSource,
                    generated_roots: allGenerated.unique(),
                    compile_classpath: compileCp,
                    test_classpath: testCp,
                    java_language_version: javaLangVersion,
                    java_release: javaRelease,
                    java_language_preview: javaPreview,
                    java_home: javaHome
                ]

                outputFile.parentFile.mkdirs()
                outputFile.text = JsonOutput.toJson(model)
            }
        }
    }

    def taskName = 'exportWorkspaceModel'
    def task = rootProject.tasks.findByName(taskName)
    if (task == null) {
        task = rootProject.tasks.create(taskName)
        task.group = 'caffeine-ls'
    }

    task.dependsOn rootProject.allprojects.collect { project ->
        project.tasks.named('exportProjectWorkspaceModel')
    }

    // Merge the per-project model files. Reading plain JSON files keeps this
    // action free of Project/Configuration references, which the
    // configuration cache could not serialize anyway.
    task.doLast {
        def projects = rootProject.allprojects.collect { project ->
            def modelFile = new File(project.buildDir, 'caffeine-ls/workspace-model.json')
            new JsonSlurper().parseText(modelFile.text)
        }
        println('WORKSPACE_MODEL_BEGIN')
        println(JsonOutput.toJson([workspace_name: rootProject.name, projects: projects]))
        println('WORKSPACE_MODEL_END')
    }
}
